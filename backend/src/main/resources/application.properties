spring.application.name=ultimos-campeoes

spring.datasource.url=jdbc:mysql://localhost:3306/ultimos_campeoes?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:bfer}
spring.datasource.password=${DB_PASS:bfer}
#spring.datasource.database=ultimos_campeoes
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
